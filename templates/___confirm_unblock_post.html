<div class="block_post" >
    <p>
        Are you sure you want to unblock this post by @{{tweet.user_username}}?
    </p>
    <p>They will be notified via email</p>
    <div>
        <a mix-get href="/confirm_post_cancel?key={{tweet.post_pk}}">Cancel</a>
        <a mix-post href="/api-unblock-post?key={{tweet.post_pk}}&username={{tweet.user_username}}">Unblock</a>
    </div>
</div>
