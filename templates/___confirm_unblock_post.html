<div>
    <div class="block_post" >
        <p>
            {{x.lans('are_you_sure_unblock').capitalize()}} {{x.lans('this_post_by')}} @{{tweet.user_username}}?
        </p>
        <p>{{x.lans('user_will_be_notified').capitalize()}}</p>
        <div>
            <a mix-get href="/.cp-ad/confirm_post_cancel?key={{tweet.post_pk}}">{{x.lans('cancel').capitalize()}}</a>
            <a mix-post href="/.cp-ad/api-unblock-post?key={{tweet.post_pk}}"mix-default="{{x.lans('unblock').capitalize()}}" 
                mix-await="{{x.lans('unblocking').capitalize()}}...">{{x.lans('unblock').capitalize()}}</a>
        </div>
    </div>
</div>
