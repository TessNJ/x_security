
{% include "_header.html" %}

<main class="x-landing">
  <div class="x-landing__left">
      <div class="x-landing__logo" aria-hidden="true">
        <svg width="300" height="300.251" version="1.1" xmlns="http://www.w3.org/2000/svg">
        <path d="M178.57 127.15 290.27 0h-26.46l-97.03 110.38L89.34 0H0l117.13 166.93L0 300.25h26.46l102.4-116.59 81.8 116.59h89.34M36.01 19.54H76.66l187.13 262.13h-40.66"/>
        </svg>
      </div>
  </div>

  <div class="x-landing__right">
    
    {% if message:%}
    <div id="toast">
      <div class='toast-ok' mix-ttl='3000'>
        {{message}}
      </div>
    </div>
    {%endif%}

    <div class="x-dialog__content">

      <div class="d-flex gap-3">

        <a href="/login/english"
        {% if lan == "english": %}
        class="current_language"
        {% endif %}
        >
          <img src="/static/images/flag_english.png" class="w-5">
        </a>

        <a href="/login/danish"
        {% if lan == "danish": %}
        class="current_language"
        {% endif %}
        >
          <img src="/static/images/flag_danish.png" class="w-5">
        </a>

        <a href="/login/spanish"
        {% if lan == "spanish": %}
        class="current_language"
        {% endif %}        
        >
          <img src="/static/images/flag_spanish.png" class="w-5">
        </a>

      </div>


        <h2 id="loginTitle">Log in to X</h2>
        <form action="/login/{{ lan }}" mix-post class="x-dialog__form" autocomplete="off">
            <input name="user_email" type="text" placeholder="{{x.lans('email').capitalize()}}" mix-check="{{ x.REGEX_EMAIL }}">
            <input name="user_password" type="password" placeholder="{{x.lans('password').capitalize()}}" mix-check="{{ x.REGEX_USER_PASSWORD }}">
            <button class="x-dialog__btn" mix-default="{{x.lans('login').capitalize()}}" mix-await="{{x.lans('logging_in').capitalize()}} in ...">
                {{x.lans('login').capitalize()}}
            </button>
        </form>
        <p class="x-dialog__alt">
            {{x.lans("dont_have_an_account").capitalize()}} ?
            <a href="{{ url_for('signup') }}">{{x.lans("sign_up").capitalize()}}</a>
        </p>
        <p class="x-dialog__alt">
            <a href="{{ url_for('request_password') }}">{{x.lans("forgot_password").capitalize()}}?</a>
        </p>
    </div>


  </div>

</main>

{% include "_footer.html" %}
