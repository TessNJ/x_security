<form id="user_block_{{user.user_pk}}" action="/.cp-ad/confirm_unblock_user?key={{user.user_pk}}&username={{user.user_username}}" mix-post>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">
        <i class="fa-solid fa-lock fa-2x" style="pointer-events: none;"></i> 
    </button>
