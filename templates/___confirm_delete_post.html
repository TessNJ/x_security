<div>
    <div class="delete_post" >
        {{x.lans('delete_post_confirm').capitalize()}}?
        <div>
            <a mix-get href="/api-cancel-confirm?key={{tweet.post_pk}}">{{x.lans('cancel').capitalize()}}</a>
            <form action="/api-delete-post?key={{tweet.post_pk}}" mix-post>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button>{{x.lans('delete').capitalize()}}</button>
            </form>
        </div>
    </div>
</div>
