<form id="post_block_{{tweet.post_pk}}" action="/.cp-ad/confirm_unblock_post?key={{tweet.post_pk}}&username={{tweet.user_username}}" mix-post>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">
        <i class="fa-solid fa-lock fa-2x" style="pointer-events: none;"></i>  
    </button>
</form>
