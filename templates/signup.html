
{% include "_header.html" %}

<main class="x-landing">
  <div class="x-landing__left">
      <div class="x-landing__logo" aria-hidden="true">
        <svg width="300" height="300.251" version="1.1" xmlns="http://www.w3.org/2000/svg">
        <path d="M178.57 127.15 290.27 0h-26.46l-97.03 110.38L89.34 0H0l117.13 166.93L0 300.25h26.46l102.4-116.59 81.8 116.59h89.34M36.01 19.54H76.66l187.13 262.13h-40.66"/>
        </svg>
      </div>
  </div>

  <div class="x-landing__right">
    
    <div class="x-dialog__content">
      <div class="d-flex gap-3">


        <a href="/signup/english"
        {% if lan == "english": %}
        class="current_language"
        {% endif %}
        >
          <img src="/static/images/flag_english.png" class="w-5">
        </a>

        <a href="/signup/danish"
        {% if lan == "danish": %}
        class="current_language"
        {% endif %}
        >
          <img src="/static/images/flag_danish.png" class="w-5">
        </a>

        <a href="/signup/spanish"
        {% if lan == "spanish": %}
        class="current_language"
        {% endif %}        
        >
          <img src="/static/images/flag_spanish.png" class="w-5">
        </a>      

      </div>

        <h2 id="loginTitle">{{ x.lans('sign_up_to_x').capitalize() }}</h2>
        <form class="x-dialog__form" action="/signup/{{lan}}" mix-post autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
              <label for="user_email">
                <span>
                  {{ x.lans('email').capitalize() }}
                </span>
              </label>
              <input name="user_email" id="user_email" type="text" mix-check="{{ x.REGEX_EMAIL }}">
            </div>
            <div>
              <label for="user_username">
                <span>{{ x.lans('username').capitalize() }}</span> - {{ x.USER_USERNAME_MIN }} {{ x.lans('to') }} {{ x.USER_USERNAME_MAX }} {{ x.lans('characters') }}
              </label>
              <input name="user_username" id="user_username" type="text" mix-check="{{ x.REGEX_USER_USERNAME }}">
            </div>
            <div>
              <label for="user_first_name">
                <span>{{ x.lans('first_name').capitalize() }}</span> - {{ x.USER_FIRST_NAME_MIN }} {{ x.lans('to') }} {{ x.USER_FIRST_NAME_MAX }} {{ x.lans('characters') }}
              </label>
              <input name="user_first_name" id="user_first_name" type="text" mix-check="{{ x.REGEX_USER_FIRST_NAME }}">
            </div>            
            <div>
              <label for="user_last_name">
                <span>{{ x.lans('last_name').capitalize() }}</span> - {{ x.USER_LAST_NAME_MIN }} {{ x.lans('to') }} {{ x.USER_LAST_NAME_MAX }} {{ x.lans('characters') }}
              </label>
              <input name="user_last_name" id="user_last_name" type="text" mix-check="{{ x.REGEX_USER_LAST_NAME }}">
            </div>            
            <div>
              <label for="password">
                <span>{{ x.lans('password').capitalize() }}</span> - {{ x.USER_PASSWORD_MIN }} {{ x.lans('to') }} {{ x.USER_PASSWORD_MAX }} {{ x.lans('characters') }}
              </label>              
              <input name="user_password" id="password" type="password" mix-check="{{ x.REGEX_USER_PASSWORD }}">
            </div>
            <div>
              <label for="user_password_confirm">
                <span>{{ x.lans('confirm_password').capitalize() }}</span> - {{ x.USER_PASSWORD_MIN }} {{ x.lans('to') }} {{ x.USER_PASSWORD_MAX }} {{ x.lans('characters') }}
              </label>              
              <input name="user_password_confirm" id="user_password_confirm" type="password" mix-check="{{ x.REGEX_USER_PASSWORD }}">
            </div>
            <button class="x-dialog__btn" 
            mix-default="{{ x.lans('sign_up').capitalize() }}" 
            mix-await="{{ x.lans('signing_up').capitalize() }}...">
                {{ x.lans('sign_up').capitalize() }}
            </button>
        </form>
        <p class="x-dialog__alt">
            {{ x.lans('already_have_account').capitalize() }}? 
            <a href="{{ url_for('login') }}">{{ x.lans('log_in').capitalize() }}</a>
        </p>
    </div>


  </div>

</main>

{% include "_footer.html" %}
