
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mixhtml.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">

    <script src="https://unpkg.com/mojocss"></script>

    <title>
        Fresh news        
    </title>
</head>
<body>
    <div id="toast"></div>
    
    
    <header class="px-4">
        <h1>X | Control Panel</h1>

        <nav>
            <a href="/control_panel/users">User panel</a>
            <a href="/control_panel/posts">Post panel</a>
            <a href="{{url_for('get_data_from_sheet')}}" mix-get>Update dictionary</a>
        </nav>
        
        <a href="{{ url_for('logout') }}">{{ x.lans('logout').capitalize() }}</a>
    </header>
    <main class="px-4">
        <h2>User manager</h2>

        <div id="users">
            {% for user in users: %}
            {% include "_user_admin.html" %}
            {% endfor %}
        </div>
        <div class="admin_show_more">
            {% if next_page != 0%}
            {% include "___show_more_users_admin.html" %}
            {% endif%}
        </div>
        <div id="block_confirm" class="pop_up_confirm"></div>
    </main>
        
    

    <script src="{{ url_for('static', filename='mixhtml.js') }}"></script>

    <script>
      mojo()
    </script>

</body>
</html>
