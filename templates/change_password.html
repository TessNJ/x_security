{% include "_header.html" %}

<main class="x-landing">
  <div class="x-landing__left">
    <div class="x-landing__logo" aria-hidden="true">
      <svg width="300" height="300.251" version="1.1" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M178.57 127.15 290.27 0h-26.46l-97.03 110.38L89.34 0H0l117.13 166.93L0 300.25h26.46l102.4-116.59 81.8 116.59h89.34M36.01 19.54H76.66l187.13 262.13h-40.66" />
      </svg>
    </div>
  </div>

  <div class="x-landing__right">

    <div id="toast"></div>

    <div class="x-dialog__content">

      <h2 id="changeTitle">{{x.lans('set_new_password').capitalize()}}</h2>
      <form action="/change_password?key={{user_password_reset}}" mix-post class="x-dialog__form" autocomplete="off">
        <div>
          <label for="password">
            <span>{{ x.lans('password').capitalize() }}</span> - {{ x.USER_PASSWORD_MIN }} {{ x.lans("to") }} {{ x.USER_PASSWORD_MAX }} {{ x.lans("characters") }}
          </label>
          <input name="user_password" type="password" placeholder="{{x.lans('password').capitalize()}}" mix-check="{{ x.REGEX_USER_PASSWORD }}" required>
        </div>
        <div>
          <label for="user_password_confirm">
            <span>{{ x.lans('confirm_password').capitalize() }}</span> - {{ x.USER_PASSWORD_MIN }} {{ x.lans('to') }} {{ x.USER_PASSWORD_MAX }} {{ x.lans('characters') }}
          </label>              
          <input name="user_password_confirm" id="user_password_confirm" type="password" mix-check="{{ x.REGEX_USER_PASSWORD }}">
        </div>
        <button class="x-dialog__btn" mix-default="{{x.lans('password_updated')}}" mix-await="{{x.lans('updating')}}...">
            {{x.lans('update_password')}}
        </button>
      </form>
    </div>


  </div>

</main>

{% include "_footer.html" %}
