<div>
    <div class="hide_post" >
        <p>
            <p>Are you sure you want to unhide this post?</p>
        </p>
        <p>Post: {{tweet.post_pk}}</p>
        <div>
            <a mix-get href="/confirm_hide_post_cancel?key={{tweet.post_pk}}">{{x.lans('cancel').capitalize()}}</a>
            <a mix-post href="/api-unhide-post?key={{tweet.post_pk}}" mix-default="unhide" 
                mix-await="unhiding...">Show</a>
        </div>
    </div>
</div>
