    <div class="d-flex a-items-center">
        <img src="{{ url_for('static', filename='uploads/'~(suggestion.user_avatar_path if suggestion.user_avatar_path else 'default.jpg')) }}"
            class="w-8 h-8 rounded-full" alt="Profile Picture">

        <div class="w-full ml-2">
            <p class="">{{suggestion.user_first_name}} {{suggestion.user_last_name}}<span
                    class="text-c-gray:+20 text-70">@{{suggestion.user_username}}</span></p>

        </div>

        {% if suggestion.followed %}
        {% include "___button_unfollow.html" %}
        {% else %}
        {% include "___button_follow.html" %}
        {% endif %}
        <!-- <button class="px-4 py-1 text-c-white bg-c-black rounded-lg">Follow</button> -->

    </div>
